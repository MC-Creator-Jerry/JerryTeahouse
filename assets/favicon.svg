<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="茶馆">
  <defs>
    <linearGradient id="teaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fa07f"/>
      <stop offset="100%" stop-color="#4f7346"/>
    </linearGradient>
  </defs>
  <circle cx="20" cy="20" r="20" fill="url(#teaBg)"/>
  <g fill="#ffffff">
    <!-- saucer -->
    <ellipse cx="20" cy="30.5" rx="9" ry="2" opacity="0.35"/>
    <!-- cup body -->
    <path d="M12 17.5h16v3c0 4.1-3.4 7.5-7.5 7.5h-1c-4.1 0-7.5-3.4-7.5-7.5v-3z" opacity="0.96"/>
    <!-- cup rim / tea surface -->
    <ellipse cx="20" cy="17.5" rx="8" ry="1.8" fill="#e2eedb" opacity="0.55"/>
    <!-- handle: ear loop attached to cup's right silhouette (top ~28,21 · bottom ~26,26) -->
    <path d="M28 21 C 34 20.5 34 27.5 26 26" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.96"/>
  </g>
  <!-- steam -->
  <g stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M15 12q1.8-2.2 0-4"/>
    <path d="M20 12q1.8-2.2 0-4"/>
    <path d="M25 12q1.8-2.2 0-4"/>
  </g>
</svg>